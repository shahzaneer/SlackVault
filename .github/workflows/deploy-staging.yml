name: Deploy SlackVault to Amazon EKS

on:
  push:
    branches: ['stage']

env:
  APP_NAME: ${{ vars.APP_NAME }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  NAMESPACE: ${{ vars.NAMESPACE }}
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
  IMAGE_TAG: ${{ github.sha }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    environment: stage

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          role-to-assume: ${{ vars.AWS_IAM_ROLE }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          docker build -t "${IMAGE_URI}" .
          docker push "${IMAGE_URI}"
          echo "image=${IMAGE_URI}" >> "${GITHUB_OUTPUT}"

      - name: Render Kubernetes manifests
        run: |
          find kubernetes/ -type f -exec sed -i \
            -e "s/_APP_NAME/$APP_NAME/g" \
            -e "s/_NAMESPACE/$NAMESPACE/g" \
            -e "s/_ECR_REPOSITORY/$ECR_REPOSITORY/g" \
            -e "s/_IMAGE_TAG/$IMAGE_TAG/g" \
            -e "s/_AWS_ACCOUNT_ID/$AWS_ACCOUNT_ID/g" \
            -e "s/_AWS_REGION/$AWS_REGION/g" {} +

      - name: Deploy to EKS
        run: |
          aws eks --region $AWS_REGION update-kubeconfig --name $CLUSTER_NAME
          kubectl apply -f kubernetes/namespace.yaml
          kubectl apply -f kubernetes/serviceaccount.yaml
          kubectl apply -f kubernetes/deployment.yaml
          kubectl apply -f kubernetes/service.yaml
          kubectl apply -f kubernetes/ingress-stg.yaml
          kubectl rollout status deployment/$APP_NAME -n $NAMESPACE --timeout=5m

      - name: Verify deployment
        run: |
          kubectl get pods -n $NAMESPACE -l app=$APP_NAME
          kubectl get ingress -n $NAMESPACE
